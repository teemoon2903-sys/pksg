name: Patch Moves Editor

on:
  push:
    paths:
      - '.github/workflows/patch-moves-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html and create backup
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          backup = Path('backups/index-before-moves-2026-08-30.html')
          backup.parent.mkdir(parents=True, exist_ok=True)
          if not backup.exists():
              backup.write_text(text, encoding='utf-8')

          css = '''\n.moveEditor{border:1px solid #e1e3e6;border-radius:14px;padding:10px;background:#f8f9fa}.moveTop{display:grid;grid-template-columns:1fr;gap:7px}.moveSearch{width:100%;padding:10px;border:1px solid #d6d9dd;border-radius:10px;background:#fff}.moveResults{display:grid;grid-template-columns:1fr;gap:5px;max-height:190px;overflow:auto}.moveResult{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:1px solid #e1e3e6;background:#fff;border-radius:10px;padding:8px}.moveResult b{font-size:12px}.moveResult small{display:block;color:#777;font-size:10px}.moveInfo{margin-top:7px;padding:8px;border-radius:10px;background:#fff;border:1px solid #e5e7ea;color:#555;font-size:11px;line-height:1.45}.moveBadges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}.moveBadge{display:inline-block;padding:2px 7px;border-radius:999px;background:#eef0f3;color:#333;font-size:10px;font-weight:800}.moveDesc{color:#666}@media(max-width:430px){.moveEditor{padding:8px}.moveResults{max-height:150px}}\n'''
          if '.moveEditor{' not in text:
              text = text.replace('</style>', css + '</style>', 1)

          text = text.replace(
              'const SPECIES_URL="https://raw.githubusercontent.com/Eemeliri/soulgold/master/docs/data/species.json",SPRITE_RAW=',
              'const SPECIES_URL="https://raw.githubusercontent.com/Eemeliri/soulgold/master/docs/data/species.json",MOVES_URL="https://raw.githubusercontent.com/Eemeliri/soulgold/master/docs/data/common.json",SPRITE_RAW='
          )
          text = text.replace(
              'let bytes=null,original=null,slot=null,sections={},edit=null,filename="PKSG.srm",speciesCatalog=[],speciesById=new Map();',
              'let bytes=null,original=null,slot=null,sections={},edit=null,filename="PKSG.srm",speciesCatalog=[],speciesById=new Map(),movesCatalog=[],movesById=new Map();'
          )

          old_ensure = '''function ensureEditorFields(){const iv=document.getElementById("iv"),ev=document.getElementById("ev"),mv=document.getElementById("mv");if(!iv.children.length)iv.innerHTML=STAT.map((n,i)=>`<label class="field">${n}<input id="iv${i}" type="number" min="0" max="31" value="0"></label>`).join("");if(!ev.children.length)ev.innerHTML=STAT.map((n,i)=>`<label class="field">${n}<input id="ev${i}" type="number" min="0" max="252" value="0"></label>`).join("");if(!mv.children.length)mv.innerHTML=[0,1,2,3].map(i=>`<label class="field">Move ${i+1}<input id="mv${i}" type="number" min="0" max="2047" value="0"></label>`).join("")}'''
          new_ensure = '''function ensureEditorFields(){const iv=document.getElementById("iv"),ev=document.getElementById("ev"),mv=document.getElementById("mv");if(!iv.children.length)iv.innerHTML=STAT.map((n,i)=>`<label class="field">${n}<input id="iv${i}" type="number" min="0" max="31" value="0"></label>`).join("");if(!ev.children.length)ev.innerHTML=STAT.map((n,i)=>`<label class="field">${n}<input id="ev${i}" type="number" min="0" max="252" value="0"></label>`).join("");if(!mv.children.length)mv.innerHTML=[0,1,2,3].map(i=>`<div class="moveEditor"><div class="moveTop"><label class="field">Move ${i+1}<input id="mvSearch${i}" class="moveSearch" type="search" autocomplete="off" placeholder="ค้นหาชื่อท่า เช่น Thunderbolt"><input id="mv${i}" type="hidden" value="0"></label><div id="mvResults${i}" class="moveResults"></div><div id="mvInfo${i}" class="moveInfo">ยังไม่ได้เลือกท่า</div></div></div>`).join("");[0,1,2,3].forEach(i=>{const s=document.getElementById("mvSearch"+i);if(s&&!s.dataset.bound){s.dataset.bound="1";s.addEventListener("input",()=>renderMovePicker(i))}})}
function moveLabel(m){return m?m.name+` • ${m.type.replace("TYPE_","")} • ${m.category.replace("DAMAGE_CATEGORY_","")}`:"ยังไม่ได้เลือกท่า"}
function moveInfoHtml(m){if(!m)return "ยังไม่ได้เลือกท่า";const power=m.power?m.power:"—",acc=m.accuracy?m.accuracy+"%":"—";return `<div class="moveBadges"><span class="moveBadge">${m.type.replace("TYPE_","")}</span><span class="moveBadge">${m.category.replace("DAMAGE_CATEGORY_","")}</span><span class="moveBadge">Power ${power}</span><span class="moveBadge">Acc ${acc}</span><span class="moveBadge">PP ${m.pp||"—"}</span>${m.priority?`<span class="moveBadge">Priority ${m.priority>0?"+":""}${m.priority}</span>`:""}</div><div class="moveDesc">${m.description||"ไม่มีคำอธิบาย"}</div>`}
function setMoveEditor(i,id){const m=movesById.get(+id);document.getElementById("mv"+i).value=m?m.id:0;document.getElementById("mvSearch"+i).value=m&&m.id?m.name:"";document.getElementById("mvInfo"+i).innerHTML=moveInfoHtml(m&&m.id?m:null);renderMovePicker(i)}
function renderMovePicker(i){const q=(document.getElementById("mvSearch"+i)?.value||"").trim().toLowerCase(),host=document.getElementById("mvResults"+i);if(!host)return;let list=q?movesCatalog.filter(m=>(m.name+" "+(m.slug||"")+" "+(m.constant||"")).toLowerCase().includes(q)).slice(0,24):[];host.innerHTML="";list.forEach(m=>{let b=document.createElement("button");b.type="button";b.className="moveResult";b.innerHTML=`<span><b>${m.name}</b><small>${m.type.replace("TYPE_","")} • ${m.category.replace("DAMAGE_CATEGORY_","")} • Power ${m.power||"—"} • PP ${m.pp||"—"}</small></span>`;b.onclick=()=>setMoveEditor(i,m.id);host.appendChild(b)})}
async function loadMoveCatalog(){try{let r=await fetch(MOVES_URL,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);let j=await r.json();let raw=j.moves||{};movesCatalog=Object.values(raw).filter(m=>m&&Number.isFinite(+m.id)).sort((a,b)=>+a.id-+b.id);movesById=new Map(movesCatalog.map(m=>[+m.id,m]));status.textContent=(status.textContent||"")+` • Moves ${movesCatalog.length}`;if(edit)for(let i=0;i<4;i++)setMoveEditor(i,edit.m.moves[i]||0)}catch(e){status.textContent=(status.textContent||"")+" • ⚠️ โหลดข้อมูลท่าไม่สำเร็จ"}}'''
          if old_ensure not in text:
              raise SystemExit('ensureEditorFields pattern not found')
          text = text.replace(old_ensure, new_ensure, 1)

          old_open_moves = 'm.moves.forEach((v,j)=>document.getElementById("mv"+j).value=v);'
          new_open_moves = 'm.moves.forEach((v,j)=>setMoveEditor(j,v));'
          if old_open_moves not in text:
              raise SystemExit('openEditor move pattern not found')
          text = text.replace(old_open_moves, new_open_moves, 1)

          old_apply_moves = 'for(let i=0;i<4;i++)m.moves.push(+document.getElementById("mv"+i).value);'
          new_apply_moves = 'for(let i=0;i<4;i++)m.moves.push(+document.getElementById("mv"+i).value||0);'
          if old_apply_moves not in text:
              raise SystemExit('applyMon move pattern not found')
          text = text.replace(old_apply_moves, new_apply_moves, 1)

          text = text.replace('fill();loadSpeciesCatalog();file.onchange=', 'fill();loadSpeciesCatalog();loadMoveCatalog();file.onchange=', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'PKSG Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html backups/index-before-moves-2026-08-30.html .github/workflows/patch-moves-ui.yml
          git commit -m 'feat: improve move editor with SoulGold move data' || exit 0
          git rm .github/workflows/patch-moves-ui.yml
          git commit -m 'chore: remove temporary patch workflow'
          git push

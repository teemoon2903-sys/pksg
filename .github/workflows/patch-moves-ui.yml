name: Patch Moves Editor

on:
  push:
    paths:
      - '.github/workflows/patch-moves-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run patcher
        run: python3 scripts/patch_moves_ui.py
      - name: Commit patched index and backup
        run: |
          git config user.name 'PKSG Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html backups/index-before-moves-2026-08-30.html scripts/patch_moves_ui.py .github/workflows/patch-moves-ui.yml
          git commit -m 'feat: improve move editor with SoulGold move data'
          git rm scripts/patch_moves_ui.py .github/workflows/patch-moves-ui.yml
          git commit -m 'chore: remove temporary moves patcher'
          git push

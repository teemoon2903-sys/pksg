name: Apply emulator save compatibility fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply emulator save compatibility fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch export filename
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''function exportSave(){if(!bytes)return alert("ยังไม่ได้เปิดเซฟ");try{let out=rebuild();dl(out,filename.replace(/\\.(sav|srm|dat)$/i,"")+"_PKSG.srm");status.textContent="✅ Export สำเร็จ • Save slot สร้างแล้ว"}catch(e){console.error(e);status.textContent="❌ Export ไม่สำเร็จ: "+(e&&e.message?e.message:e);alert("Export ไม่สำเร็จ\\n\\n"+(e&&e.message?e.message:e))}}'''
          new = '''function exportSave(){if(!bytes)return alert("ยังไม่ได้เปิดเซฟ");try{let out=rebuild();let ext=(filename.match(/\\.(sav|srm|dat)$/i)||[".srm"])[0];let outName=filename.replace(/\\.(sav|srm|dat)$/i,"")+ext;dl(out,outName);status.textContent="✅ Export สำเร็จ • ใช้ชื่อไฟล์เดิมเพื่อให้ Emulator จับคู่ Save กับ ROM ได้"}catch(e){console.error(e);status.textContent="❌ Export ไม่สำเร็จ: "+(e&&e.message?e.message:e);alert("Export ไม่สำเร็จ\\n\\n"+(e&&e.message?e.message:e))}}'''
          if old not in s:
              raise SystemExit('target exportSave function not found; no changes made')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply emulator save compatibility fix'
          git push
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/apply-emulator-save-fix.yml
          git add .github/workflows/apply-emulator-save-fix.yml
          git commit -m 'Remove temporary save fix workflow'
          git push

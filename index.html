<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>PKSG SoulGold GBA</title><style>body{font-family:system-ui;margin:auto;max-width:900px;padding:12px;background:#eee}section,.top{background:#fff;padding:14px;margin:10px 0;border-radius:14px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}input,select,button{padding:9px;border-radius:8px;border:1px solid #ccc}button{font-weight:700}.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.slot{background:#fafafa;border:1px solid #ddd;border-radius:9px;padding:8px;text-align:center;min-height:55px}.modal{display:none;position:fixed;inset:0;background:#0008;padding:10px}.modal>div{max-width:700px;margin:auto;background:#fff;padding:15px;border-radius:14px}.show{display:block}@media(max-width:600px){.slots{grid-template-columns:repeat(3,1fr)}}pre{white-space:pre-wrap}
</style><div class=top><h1>🔥 PKSG</h1><b>Pokémon SoulGold GBA — Save Editor</b><p><input id=f type=file accept=.srm,.sav,.dat> <button id=open>เปิด/อ่านเซฟ</button></p><small id=info>ยังไม่ได้เปิดเซฟ</small><div><button data-x=party>Party</button><button data-x=pc>PC</button><button data-x=bag>Bag</button><button data-x=tools>Tools</button></div><pre id=st>รอเปิดเซฟ</pre></div><section id=party><h2>Party</h2><div id=pg class=slots></div><div class=g><label>Party<input id=cnt type=number min=0 max=6></label><label>Money<input id=money type=number></label></div></section><section id=pc hidden><h2>PC — 14 boxes × 30 × 80 bytes</h2><div class=g><label>Box<select id=box></select></label><label>Slot<input id=bs type=number min=1 max=30 value=1></label></div><div id=bg class=slots></div><hr><div class=g><label>Species<input id=ns type=number min=1 max=2047></label><label>Level<input id=nl type=number min=1 max=100 value=5></label><label>Nature<select id=nn></select></label></div><button onclick=createMon()>สร้าง Pokémon</button></section><section id=bag hidden><h2>Bag</h2><div class=g><label>Item ID<input id=iid type=number></label><label>Qty<input id=iq type=number></label><label>Slot<input id=is type=number></label></div><button onclick=setItem()>บันทึก Item</button></section><section id=tools hidden><button onclick=validate()>ตรวจสอบเซฟ</button> <button onclick=exportSave()>Export .srm</button> <button onclick=backup()>Backup</button><pre id=diag></pre><small>128 KiB • 2 save blocks • 14 sectors/block • 3968-byte data/checksum • 14 PC boxes × 30 × 80-byte BoxPokemon</small></section><div id=modal class=modal><div><button onclick=closeEdit()>ปิด</button><h2>Pokémon</h2><div class=g><label>Species<input id=es type=number></label><label>Level<input id=el type=number min=1 max=100></label><label>Nature<select id=en></select></label><label>Item<input id=ei type=number></label><label>Shiny<select id=ey><option value=0>No</option><option value=1>Yes</option></select></label></div><h3>IV</h3><div id=iv class=g></div><h3>EV</h3><div id=ev class=g></div><h3>Moves</h3><div id=mv class=g></div><button onclick=saveMon()>บันทึก Pokémon</button></div></div><script>
const N=['Hardy','Lonely','Brave','Adamant','Naughty','Bold','Docile','Relaxed','Impish','Lax','Timid','Hasty','Serious','Jolly','Naive','Modest','Mild','Quiet','Bashful','Rash','Calm','Gentle','Sassy','Careful','Quirky'],SZ=4096,D=3968,SIG=0x08012025,Q=[[0,1,2,3],[0,1,3,2],[0,2,1,3],[0,2,3,1],[0,3,1,2],[0,3,2,1],[1,0,2,3],[1,0,3,2],[1,2,0,3],[1,2,3,0],[1,3,0,2],[1,3,2,0],[2,0,1,3],[2,0,3,1],[2,1,0,3],[2,1,3,0],[2,3,0,1],[2,3,1,0],[3,0,1,2],[3,0,2,1],[3,1,0,2],[3,1,2,0],[3,2,0,1],[3,2,1,0]];let B,O,S,sec={},ed;function u16(a,o){return a[o]|a[o+1]<<8}function u32(a,o){return(a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0}function w16(a,o,v){a[o]=v&255;a[o+1]=v>>>8&255}function w32(a,o,v){a[o]=v&255;a[o+1]=v>>>8&255;a[o+2]=v>>>16&255;a[o+3]=v>>>24&255}function sum(a){let s=0;for(let i=0;i<a.length;i+=4)s=s+u32(a,i)>>>0;return(s&65535)+(s>>>16)&65535}function ok(x){let i=u16(x,4084);return i<14&&u32(x,4088)==SIG&&sum(x.slice(0,D))==u16(x,4086)}function read(base){let a=[];for(let p=0;p<14;p++){let x=B.slice(base+p*SZ,base+(p+1)*SZ),i=u16(x,4084);if(i<14&&u32(x,4088)==SIG)a.push({i,c:u32(x,4092),x})}if(a.length!=14||new Set(a.map(x=>x.i)).size!=14||a.some(x=>!ok(x.x)||x.c!=a[0].c))return null;return{base,c:a[0].c,a}}function pick(){return[read(0),read(14*SZ)].filter(Boolean).sort((a,b)=>(b.c-a.c))[0]}function crypt(a,k){for(let i=0;i<48;i+=4)w32(a,i,u32(a,i)^k)}function dec(r){let a=r.slice(),p=u32(a,0),o=u32(a,4),e=a.slice(32,80),d=new Uint8Array(48),q=Q[p%24];crypt(e,p^o);for(let i=0;i<4;i++)d.set(e.slice(i*12,i*12+12),q[i]*12);a.set(d,32);return a}function enc(a){let p=u32(a,0),o=u32(a,4),e=new Uint8Array(48),q=Q[p%24];for(let i=0;i<4;i++)e.set(a.slice(32+q[i]*12,44+q[i]*12),i*12);crypt(e,p^o);a.set(e,32);return a}function ex(l){l=Math.max(1,Math.min(100,l));return Math.max(0,Math.floor(6*l*l*l/5-15*l*l+100*l-140))}function lv(e){let l=1;for(let i=1;i<=100;i++)if(e>=ex(i))l=i;else break;return l}function mon(r,party){let a=dec(r),p=u32(a,0),o=u32(a,4),m={p,o,s:u16(a,32),item:u16(a,34),exp:u32(a,36)&0xffffff,n:p%25,sh:((((p&65535)^(p>>>16)^((o&65535)^(o>>>16)))>>>0)<8),iv:[],ev:[],mv:[],a};for(let i=0;i<6;i++){m.iv[i]=u32(a,68)>>>i*5&31;m.ev[i]=a[56+i]}for(let i=0;i<4;i++)m.mv[i]=u16(a,44+i*2);m.l=lv(m.exp);if(party)m.l=Math.max(1,Math.min(100,r[84]||m.l));return m}function msum(a){return sum(a.slice(32,80))}function shine(p,o){return((((p&65535)^(p>>>16)^((o&65535)^(o>>>16)))>>>0)<8)}function pid(p,o,n,s){p>>>=0;p=(p+(n-p%25+25)%25)>>>0;if(shine(p,o)!=!!s)for(let k=1;k<0x100000;k++){let z=(p+k*25)>>>0;if(shine(z,o)==!!s)return z}return p}function write(m,r){let a=dec(r),p=u32(a,0),o=u32(a,4);if(!p){crypto.getRandomValues(a.subarray(0,8));p=u32(a,0);o=u32(a,4)}p=pid(p,o,m.n,m.sh);w32(a,0,p);w16(a,32,m.s);w16(a,34,m.item);w32(a,36,ex(m.l));for(let i=0;i<4;i++)w16(a,44+i*2,m.mv[i]||0);for(let i=0;i<6;i++)a[56+i]=Math.max(0,Math.min(255,m.ev[i]||0));let v=u32(a,68);for(let i=0;i<6;i++)v=(v&~(31<<i*5))|((m.iv[i]&31)<<i*5);w32(a,68,v);w16(a,28,msum(a));return enc(a)}function get(off,n){let r=new Uint8Array(n),p=0;for(let i=5;i<14&&p<n;i++){let x=sec[i];if(off>=D){off-=D;continue}let q=Math.min(n-p,D-off);r.set(x.slice(off,off+q),p);p+=q;off=0}return r}function put(off,d){let p=0;for(let i=5;i<14&&p<d.length;i++){let x=sec[i];if(off>=D){off-=D;continue}let q=Math.min(d.length-p,D-off);x.set(d.slice(p,p+q),off);p+=q;off=0}}function render(){let s=sec[1],a=[];cnt.value=s[0x234];money.value=(u32(s,0x490)^u32(sec[0],0xac))>>>0;for(let i=0;i<6;i++)a.push(mon(s.slice(0x238+i*100,0x238+i*100+100),1));pg.innerHTML=a.map((m,i)=>m.s?`<div class=slot onclick='edit("p",${i})'>#${m.s}<br>Lv.${m.l}</div>`:'<div class=slot>ว่าง</div>').join('');renderBox()}function renderBox(){let b=+box.value;bg.innerHTML='';for(let i=0;i<30;i++){let m=mon(get(4+(b*30+i)*80,80),0),d=document.createElement('div');d.className='slot';d.textContent=m.s?'#'+m.s+' Lv.'+m.l:i+1+' ว่าง';d.onclick=()=>m.s&&edit('b',i);bg.appendChild(d)}}function edit(w,i){let off=w=='p'?0x238+i*100:4+(+box.value*30+i)*80,r=w=='p'?sec[1].slice(off,off+100):get(off,80),m=mon(r,w=='p');ed={w,i,off,r};es.value=m.s;el.value=m.l;en.value=m.n;ei.value=m.item;ey.value=m.sh?1:0;for(let j=0;j<6;j++){document.getElementById('i'+j).value=m.iv[j];document.getElementById('v'+j).value=m.ev[j]}for(let j=0;j<4;j++)document.getElementById('m'+j).value=m.mv[j];modal.className='modal show'}function closeEdit(){modal.className='modal'}function saveMon(){let m={s:+es.value,l:+el.value,n:+en.value,item:+ei.value,sh:+ey.value,iv:[],ev:[],mv:[]};for(let i=0;i<6;i++){m.iv[i]=+document.getElementById('i'+i).value;m.ev[i]=+document.getElementById('v'+i).value}for(let i=0;i<4;i++)m.mv[i]=+document.getElementById('m'+i).value;let z=write(m,ed.r);ed.w=='p'?sec[1].set(z,ed.off):put(ed.off,z);if(ed.w=='p')sec[1][ed.off+84]=m.l;closeEdit();render();st.textContent='แก้ Pokémon แล้ว — Export'}function createMon(){let b=+box.value,i=+bs.value-1,r=get(4+(b*30+i)*80,80),m={s:+ns.value,l:+nl.value,n:+nn.value,item:0,sh:0,iv:[31,31,31,31,31,31],ev:[0,0,0,0,0,0],mv:[0,0,0,0]},z=write(m,r);put(4+(b*30+i)*80,z);render()}function setItem(){let s=sec[1],i=+is.value,o=0x560+i*4;w16(s,o,+iid.value);w16(s,o+2,+iq.value);st.textContent='Item แก้แล้ว — Export'}function validate(){diag.textContent=S?'❌':'❌';diag.textContent=S?`✅ VALID 14/14 sectors\nChecksum 14/14\nCounter ${S.c}`:'❌ ยังไม่ได้เปิดเซฟ'}function exportSave(){if(!S)return;let out=B.slice(),c=(S.c+1)>>>0,base=S.base?0:14;for(let i=0;i<14;i++){let po=(base+i)*SZ,d=sec[i];out.fill(0,po,po+SZ);out.set(d,po);w16(out,po+4084,i);w16(out,po+4086,sum(d));w32(out,po+4088,SIG);w32(out,po+4092,c)}dl(out,fn+'_PKSG.srm');st.textContent='Export สำเร็จ Counter '+S.c+' → '+c}function dl(d,n){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d]));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){dl(O,fn+'_BACKUP.srm')}for(let i=0;i<14;i++)box.innerHTML+=`<option value=${i}>Box ${i+1}</option>`;N.forEach((n,i)=>{nn.innerHTML+=`<option value=${i}>${n}</option>`;en.innerHTML+=`<option value=${i}>${n}</option>`});for(let i=0;i<6;i++){iv.innerHTML+=`<label>IV${i}<input id=i${i} type=number min=0 max=31></label>`;ev.innerHTML+=`<label>EV${i}<input id=v${i} type=number min=0 max=255></label>`}for(let i=0;i<4;i++)mv.innerHTML+=`<input id=m${i} type=number>`;document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>['party','pc','bag','tools'].forEach(x=>document.getElementById(x).hidden=x!=b.dataset.x));open.onclick=()=>f.files[0]&&load(f.files[0]);f.onchange=()=>f.files[0]&&load(f.files[0]);box.onchange=renderBox;async function load(file){B=new Uint8Array(await file.arrayBuffer());O=B.slice();fn=file.name;if(B.length!=131072)return st.textContent='❌ ต้องเป็น 128 KiB';S=pick();if(!S)return st.textContent='❌ ไม่พบ VALID save slot';sec={};S.a.forEach(x=>sec[x.i]=x.x.slice(0,D));info.textContent=fn+' • 128 KiB • Counter '+S.c+' • VALID 14/14';render();validate()}

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PKSG Beta — SoulGold Save Editor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f3f5;color:#171717;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:16px}
.head{background:#111;color:#fff;border-radius:20px;padding:20px;margin-bottom:14px}
h1,h2,h3{margin:0 0 10px}.sub{opacity:.75}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 15px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label{font-weight:700;font-size:13px;display:block}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;background:#fff;font:inherit}
button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}
.primary{background:#111;color:#fff}.secondary{background:#e8e8e8}.danger{background:#fff0f0;color:#9b1c1c}
.status{background:#f3f3f3;border-radius:10px;padding:11px;white-space:pre-wrap}
.small{font-size:12px;color:#666}
.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}
.tab{white-space:nowrap}.tab.active{background:#111;color:#fff}
.party{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.slot{border:1px solid #ddd;border-radius:14px;padding:8px;text-align:center;background:#fafafa;cursor:pointer}
.slot.active{border:2px solid #111}
.slot img{width:75px;height:75px;image-rendering:pixelated;object-fit:contain}
.empty{opacity:.45}
.boxgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.boxslot{min-height:110px}
@media(max-width:650px){
 .party{grid-template-columns:repeat(3,1fr)}
 .boxgrid{grid-template-columns:repeat(5,1fr)}
}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;padding:12px;overflow:auto}
.modal.show{display:block}
.modalbox{max-width:760px;margin:20px auto;background:#fff;border-radius:20px;padding:18px}
.modalhead{display:flex;justify-content:space-between;align-items:center}
.pokehead{display:flex;gap:15px;align-items:center}
.pokehead img{width:120px;height:120px;image-rendering:pixelated}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:500px){.statgrid{grid-template-columns:repeat(2,1fr)}}

.pokemon-picker-wrap{margin-top:12px}
.pokemon-search-row{display:flex;gap:8px}
.pokemon-search-row input{flex:1}
.pokemon-picker{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(115px,1fr));
 gap:8px;
 margin-top:10px;
 max-height:430px;
 overflow:auto;
 padding:5px;
 border:1px solid #eee;
 border-radius:14px;
 background:#fafafa;
}
.pokemon-card{
 border:2px solid transparent;
 border-radius:14px;
 padding:8px 5px;
 text-align:center;
 background:#fff;
 cursor:pointer;
 transition:.12s;
}
.pokemon-card:hover{transform:translateY(-2px);box-shadow:0 3px 10px #0002}
.pokemon-card.selected{border-color:#111;background:#eee}
.pokemon-card img{width:72px;height:72px;object-fit:contain;image-rendering:pixelated}
.pokemon-card b{display:block;font-size:12px;line-height:1.2}
.pokemon-card small{display:block;color:#777;margin-top:2px}
.picker-status{padding:12px;text-align:center;color:#666}
.selected-pokemon{
 display:flex;align-items:center;gap:10px;
 margin-top:10px;padding:8px 10px;
 border-radius:12px;background:#f3f3f3;
}
.selected-pokemon img{width:50px;height:50px;image-rendering:pixelated;object-fit:contain}
</style>
</head>
<body>
<div class="wrap">
<div class="head">
 <h1>🔥 PKSG</h1>
 <div class="sub">SoulGold GBA Save Editor — Custom ROM Map Integrated</div>
</div>

<div class="card">
<h2>📂 Save</h2>
<input id="file" type="file" accept=".srm,.sav,.dat">
<button class="primary" type="button" id="openSaveBtn" style="margin-top:10px">📂 เปิด/อ่านเซฟ</button>
<div id="fileInfo" class="small" style="margin-top:8px">ยังไม่ได้เปิดเซฟ</div>
<div class="tabs">
<button class="tab active" data-tab="party">🐉 Party</button>
<button class="tab" data-tab="pc">📦 PC</button>
</div>
<div id="status" class="status">รอเปิดไฟล์เซฟ</div>
</div>

<section id="pc" class="panel">
<div class="card">
<h2>📦 PC Boxes (ROM Map Selection)</h2>

<div class="pokemon-picker-wrap">
 <label>🔍 ค้นหา Pokémon (ID 1 – 1577)</label>
 <div class="pokemon-search-row">
  <input id="pokemonSearch" type="text" placeholder="พิมพ์ชื่อ หรือ ID เช่น 6, 907, 1400, 1431">
  <button class="secondary" type="button" id="clearPokemonSearch">ล้าง</button>
 </div>

 <div id="selectedPokemon" class="selected-pokemon" hidden>
  <div class="small">เลือกอยู่: <b id="selectedPokemonName"></b> (ID: <span id="selectedPokemonId"></span>) - <span id="selectedPokemonForm"></span></div>
 </div>

 <div id="pokemonPicker" class="pokemon-picker"></div>
</div>

<div class="grid" style="margin-top:12px">
 <div>
  <label>Species ID (1-1577)</label>
  <input id="speciesId" type="number" min="1" max="1577" value="1" readonly>
 </div>
 <div>
  <label>Species ID (สร้างตัวใหม่)</label>
  <input id="newSpecies" type="number" min="1" max="1577" value="1" readonly>
 </div>
</div>
</div>
</section>
</div>

<script>
// แมปข้อมูล ID จาก TXT (Master ROM Map)
const POKEMON_MAP = [
  { id: 1, name: "Bulbasaur", form: "Base" },
  { id: 2, name: "Ivysaur", form: "Base" },
  { id: 3, name: "Venusaur", form: "Base" },
  { id: 4, name: "Charmander", form: "Base" },
  { id: 5, name: "Charmeleon", form: "Base" },
  { id: 6, name: "Charizard", form: "Base" },
  { id: 7, name: "Squirtle", form: "Base" },
  { id: 8, name: "Wartortle", form: "Base" },
  { id: 9, name: "Blastoise", form: "Base" },
  { id: 25, name: "Pikachu", form: "Base" },
  { id: 150, name: "Mewtwo", form: "Base" },
  { id: 323, name: "Camerupt", form: "Base" },
  { id: 906, name: "Venusaur", form: "Mega" },
  { id: 907, name: "Charizard", form: "Mega X" },
  { id: 908, name: "Charizard", form: "Mega Y" },
  { id: 909, name: "Blastoise", form: "Mega" },
  { id: 937, name: "Camerupt", form: "Mega" },
  { id: 956, name: "Rattata", form: "Alolan" },
  { id: 974, name: "Meowth", form: "Galarian" },
  { id: 993, name: "Growlithe", form: "Hisuian" },
  { id: 1400, name: "Koraidon", form: "Base" },
  { id: 1401, name: "Miraidon", form: "Base" },
  { id: 1416, name: "Ogerpon", form: "Base / Mask Slot 1" },
  { id: 1431, name: "Terapagos", form: "Normal" },
  { id: 1432, name: "Terapagos", form: "Terastal" },
  { id: 1433, name: "Terapagos", form: "Stellar" },
  { id: 1489, name: "Venusaur", form: "Gigantamax" },
  { id: 1491, name: "Charizard", form: "Gigantamax" },
  { id: 1521, name: "Urshifu", form: "Single-Strike G-Max" },
  { id: 1522, name: "Urshifu", form: "Rapid-Strike G-Max" },
  { id: 1577, name: "Dialga", form: "Mega / Legends Z-A" }
];

function renderPokemonPicker(filterText = "") {
  const container = document.getElementById("pokemonPicker");
  container.innerHTML = "";
  
  const filtered = POKEMON_MAP.filter(p => 
    p.name.toLowerCase().includes(filterText.toLowerCase()) || 
    p.id.toString().includes(filterText)
  );

  filtered.forEach(p => {
    const card = document.createElement("div");
    card.className = "pokemon-card";
    card.innerHTML = `
      <b>#${String(p.id).padStart(4, '0')} ${p.name}</b>
      <small>${p.form}</small>
    `;
    card.onclick = () => selectPokemon(p);
    container.appendChild(card);
  });
}

function selectPokemon(p) {
  document.getElementById("speciesId").value = p.id;
  document.getElementById("newSpecies").value = p.id;
  document.getElementById("selectedPokemonName").innerText = p.name;
  document.getElementById("selectedPokemonId").innerText = p.id;
  document.getElementById("selectedPokemonForm").innerText = p.form;
  document.getElementById("selectedPokemon").hidden = false;
}

document.getElementById("pokemonSearch").oninput = (e) => {
  renderPokemonPicker(e.target.value);
};

document.getElementById("clearPokemonSearch").onclick = () => {
  document.getElementById("pokemonSearch").value = "";
  renderPokemonPicker();
};

// โหลดรายการเมื่อเริ่มต้น
renderPokemonPicker();
</script>
</body>
</html>

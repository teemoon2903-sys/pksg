6;i++)a[56+i]=Math.max(0,Math.min(255,m.ev[i]||0));let v=u32(a,68);for(let i=0;i<6;i++)v=(v&~(31<<i*5))|((m.iv[i]&31)<<i*5);w32(a,68,v);w16(a,28,sum(a.slice(32,80)));return enc(a)}function saveMon(){let m={s:+esel.value,l:+el.value,n:+en.value,item:+ei.value,sh:+ey.value,iv:[],ev:[],mv:[]};for(let i=0;i<6;i++){m.iv[i]=+document.getElementById('i'+i).value;m.ev[i]=+document.getElementById('v'+i).value}for(let i=0;i<4;i++)m.mv[i]=+document.getElementById('m'+i).value;let z=write(m,ed.r);ed.w=='p'?sec[1].set(z,ed.off):put(ed.off,z);closeEdit();render()}function createMon(){let b=+box.value,i=0,r=get(4+(b*30+i)*80,80),m={s:+psel.value,l:+nl.value,n:0,item:0,sh:0,iv:[31,31,31,31,31,31],ev:[0,0,0,0,0,0],mv:[0,0,0,0]};put(4+(b*30+i)*80,write(m,r));render()}function dl(d,n){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d]));a.download=n;a.click()}function backup(){dl(O,fn+'_BACKUP.srm')}function exportSave(){if(!S)return;let out=B.slice(),c=S.c+1,base=S.base?0:14;for(let i=0;i<14;i++){let po=(base+i)*SZ,d=sec[i];out.set(d,po);w16(out,po+4084,i);w16(out,po+4086,sum(d));w32(out,po+4088,SIG);w32(out,po+4092,c)}dl(out,fn+'_PKSG.srm')}for(let i=0;i<14;i++)box.innerHTML+=`<option value=${i}>Box ${i+1}</option>`;N.forEach((x,i)=>en.innerHTML+=`<option value=${i}>${x}</option>`);options(psel);psearch.oninput=()=>{options(psel,psearch.value);updatePreview()};psel.onchange=updatePreview;box.onchange=renderBox;document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-x]').forEach(x=>x.classList.toggle('active',x===b));['party','pc','bag','tools'].forEach(x=>document.getElementById(x).hidden=x!=b.dataset.x)});f.onchange=()=>f.files[0]&&load(f.files[0]);async function load(file){B=new Uint8Array(await file.arrayBuffer());O=B.slice();fn=file.name;if(B.length!=131072)return info.textContent='❌ ต้องเป็น 128 KiB';S=pick();if(!S)return info.textContent='❌ ไม่พบ VALID save slot';sec={};S.a.forEach(x=>sec[x.i]=x.x.slice(0,D));info

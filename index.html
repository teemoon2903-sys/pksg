<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PKSG — SoulGold GBA Save Editor</title></head>
<body><div id="boot" style="font-family:system-ui;padding:20px">กำลังโหลด PKSG…</div>
<script>
(async()=>{
 try{
  const r=await fetch('https://raw.githubusercontent.com/teemoon2903-sys/pksg/e507827ede8c38c8fb274200abd0aef65e00d6d4/index.html?'+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('โหลดไฟล์ต้นฉบับไม่สำเร็จ: HTTP '+r.status);
  let html=await r.text();
  html=html.replace(/const SIZE=\{[^;]+\};/,'const SIZE={0:3884,1:3968,2:3968,3:3968,4:3664,5:3968,6:3968,7:3968,8:3968,9:3968,10:3968,11:3968,12:3968,13:3968};');
  html=html.replace(/function sectionSize\(id,s\)\{[^}]*\}/,'function sectionSize(id,s){return SIZE[id]??DATA}');
  const rebuild=/function rebuild\(\)\{[\s\S]*?\}\s*function exportSave/;
  const replacement=`function rebuild(){
 const out=bytes.slice(),sourceBase=slot.base,targetBase=sourceBase===0?14:0,counter=(slot.counter+1)>>>0,order=[];
 for(let i=0;i<14;i++){
  const po=(sourceBase+i)*SECTOR,id=u16(bytes,po+4084);
  if(id<14)order.push(id);
 }
 if(order.length!==14||new Set(order).size!==14)throw new Error("ไม่พบ 14 sectors ของ Save Slot ที่สมบูรณ์");
 const rotated=[order[order.length-1],...order.slice(0,-1)];
 for(let physical=0;physical<14;physical++){
  const id=rotated[physical],po=(targetBase+physical)*SECTOR;
  const source=slot.ss.find(x=>x.id===id);
  const data=sec(id),size=SIZE[id]??DATA;
  out.fill(0,po,po+SECTOR);
  out.set(data.slice(0,DATA),po);
  if(source)out.set(bytes.slice((sourceBase+source.p)*SECTOR+DATA,(sourceBase+source.p)*SECTOR+DATA+116),po+DATA);
  w16(out,po+4084,id);
  w16(out,po+4086,csum(data.slice(0,size)));
  w32(out,po+4088,SIG);
  w32(out,po+4092,counter);
 }
 return out;
}
function exportSave`;
  if(!rebuild.test(html))throw new Error('ไม่พบ Save Rebuild Engine ใน index.html ต้นฉบับ');
  html=html.replace(rebuild,replacement);
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('boot').textContent='❌ '+e.message;}
})();
</script></body></html>
